name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - run: dotnet restore backend/WhatsBiz.sln
      - run: dotnet build backend/WhatsBiz.sln --no-restore --configuration Release
      - run: dotnet test backend/WhatsBiz.sln --no-build --configuration Release
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/WhatsBiz.Web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/WhatsBiz.Web/package-lock.json }
      - run: npm ci
      - run: npm run build
