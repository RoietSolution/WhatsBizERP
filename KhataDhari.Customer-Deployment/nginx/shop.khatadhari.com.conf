server {
    listen 80;
    listen [::]:80;
    server_name shop.khatadhari.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.khatadhari.com;
    ssl_certificate /etc/letsencrypt/live/shop.khatadhari.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.khatadhari.com/privkey.pem;
    root /var/www/khatadhari-customer/browser;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* [A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
