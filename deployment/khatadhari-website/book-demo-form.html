<!-- Replace the existing Book a Demo form body with this markup, preserving the surrounding modal/section. -->
<form id="book-demo-form" class="kd-demo-form" novalidate data-api-base="">
  <div class="kd-demo-grid">
    <label>Name <span aria-hidden="true">*</span><input name="name" type="text" maxlength="100" autocomplete="name" required /></label>
    <label>Mobile Number <span aria-hidden="true">*</span><input name="mobile" type="tel" maxlength="24" inputmode="tel" autocomplete="tel" required /></label>
    <label>Email<input name="email" type="email" maxlength="254" autocomplete="email" /></label>
    <label>Business Name<input name="businessName" type="text" maxlength="150" autocomplete="organization" /></label>
    <label>City<input name="city" type="text" maxlength="100" autocomplete="address-level2" /></label>
    <label>Business Type / Retail Segment
      <select name="businessType">
        <option value="">Select a segment</option>
        <option>Saree / Garments / Boutique</option><option>Grocery / General Store</option>
        <option>Cosmetics / Beauty</option><option>Electronics / Accessories</option>
        <option>Footwear / Lifestyle</option><option>Home Furnishing / Decor</option><option>Other</option>
      </select>
    </label>
    <label class="kd-demo-full">Message / Requirement<textarea name="message" maxlength="2000" rows="4"></textarea></label>
  </div>
  <div class="kd-captcha" aria-live="polite"></div>
  <div class="kd-demo-error" role="alert" hidden></div>
  <button class="kd-demo-submit" type="submit"><span class="kd-submit-label">Book My Demo</span></button>
</form>
<section class="kd-demo-success" role="status" aria-live="polite" hidden>
  <h3>Demo Request Received</h3>
  <p>Thank you, <strong class="kd-customer-name"></strong>.</p>
  <p>Your KhataDhari demo request has been submitted successfully.</p>
  <p>Reference: <strong class="kd-reference"></strong></p>
  <p>Our team will contact you shortly.</p>
  <a class="kd-whatsapp" target="_blank" rel="noopener noreferrer" hidden>Contact us on WhatsApp</a>
</section>

<!-- Load jQuery once using the website's existing bundle, then these versioned assets. -->
<link rel="stylesheet" href="/assets/book-demo.css" />
<script src="/assets/book-demo.js" defer></script>
