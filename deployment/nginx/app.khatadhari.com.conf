server {
    listen 80;
    listen [::]:80;
    server_name app.khatadhari.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.khatadhari.com;

    ssl_certificate /etc/letsencrypt/live/app.khatadhari.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.khatadhari.com/privkey.pem;
    root /var/www/whatsbiz-prod-web/browser;
    index index.html;

    location = /runtime-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
