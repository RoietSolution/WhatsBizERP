# Temporary HTTP-only webroot challenge site. Replace with the two TLS vhosts
# after Certbot has issued both certificates.
server {
    listen 80;
    listen [::]:80;
    server_name api.khatadhari.com app.khatadhari.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
