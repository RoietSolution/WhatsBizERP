# Temporary HTTP-only ACME challenge vhost for the dedicated SQL hostname.
# It intentionally does not proxy or expose SQL Server traffic.
server {
    listen 80;
    listen [::]:80;
    server_name sql.khatadhari.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
