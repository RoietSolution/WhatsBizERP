<section class="profile-card" aria-labelledby="profile-title"><header class="profile-card-header"><span class="eyebrow">PROFILE</span><h2 id="profile-title">My Profile</h2><p>Keep your customer details up to date.</p></header>
@if(session.customer(); as customer){<div class="profile-photo-row">@if(customer.profileImageUrl; as avatar){<img class="large-avatar" [src]="avatar" alt="Profile photo">}@else{<span class="large-avatar initials">{{initials(customer.name)}}</span>}<div><strong>Profile photo</strong><p>JPG, PNG or WebP up to 5 MB.</p><button type="button" class="secondary-button" (click)="photoInput.click()" [disabled]="photoBusy()">{{photoBusy()?'Updating…':'Change photo'}}</button>@if(customer.profileImageUrl){<button type="button" class="remove-button" (click)="removePhoto()" [disabled]="photoBusy()">Remove</button>}</div><input #photoInput class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp" (change)="photo($event)" aria-label="Choose profile photo"></div><form (submit)="$event.preventDefault();save()"><div class="form-grid"><label><span>Full Name</span><input [value]="name" (input)="name=$any($event.target).value" maxlength="250" required></label><label><span>Mobile Number <em>Verified</em></span><input [value]="customer.mobile||''" readonly></label><label class="full-field"><span>Email <small>Optional</small></span><input [value]="email" (input)="email=$any($event.target).value" type="email" maxlength="256"></label></div><button class="save-button" type="submit" [disabled]="saving()">{{saving()?'Saving…':'Save Changes'}}</button></form>@if(message()){<p class="profile-status" role="status" aria-live="polite">{{message()}}</p>}}</section>
