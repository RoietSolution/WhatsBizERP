<section class="account"><span>MY ACCOUNT</span><h1>Account details</h1>@if(!session.active()){<p>Please <a [routerLink]="['/',storeKey,'auth']">sign in</a> to view your account.</p>}@else{<form (submit)="$event.preventDefault();save()"><label>Verified mobile<input [value]="session.customer()?.mobile||''" readonly></label><label>Name<input [value]="name" (input)="name=($any($event.target).value)" maxlength="250" required></label><label>Email (optional)<input [value]="email" (input)="email=($any($event.target).value)" type="email" maxlength="256"></label><button type="submit" [disabled]="saving()">{{saving()?'Saving...':'Save profile'}}</button></form>@if(message()){<p>{{message()}}</p>}}</section>
