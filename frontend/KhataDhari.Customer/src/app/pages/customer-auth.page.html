<section class="auth"><span class="eyebrow">CUSTOMER ACCOUNT</span><h1>{{mode==='signup'?'Create your account':'Sign in'}}</h1><p>We will verify your mobile number with a one-time code. No password is needed.</p>
<div class="tabs"><button type="button" [class.active]="mode==='signin'" (click)="mode='signin'">Sign In</button><button type="button" [class.active]="mode==='signup'" (click)="mode='signup'">Sign Up</button></div>
@if(!challengeId){<form (submit)="$event.preventDefault();send()"><label>Mobile number *<input [value]="mobile" (input)="mobile=($any($event.target).value)" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="10-digit mobile number" required></label>
@if(mode==='signup'){<label>Name (optional)<input [value]="name" (input)="name=($any($event.target).value)" maxlength="250" autocomplete="name"></label><label>Email (optional)<input [value]="email" (input)="email=($any($event.target).value)" maxlength="256" type="email" autocomplete="email"></label>}
<button [disabled]="busy()" type="submit">{{busy()?'Sending...':'Send OTP'}}</button></form>}
@else{<form (submit)="$event.preventDefault();verify()"><p class="sent">Code sent for {{mobile}}. It expires in 5 minutes.</p><label>6-digit OTP *<input [value]="otp" (input)="otp=($any($event.target).value)" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label><button [disabled]="busy()||otp.length!==6" type="submit">{{busy()?'Verifying...':'Verify OTP'}}</button><button class="link" type="button" [disabled]="busy()||!canResend()" (click)="send()">Resend OTP</button><button class="link" type="button" (click)="challengeId='';otp=''">Change mobile number</button></form>}
@if(error()){<p class="error" role="alert">{{error()}}</p>}</section>
