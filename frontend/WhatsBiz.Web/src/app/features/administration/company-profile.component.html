<app-page-container><app-page-header eyebrow="Organization" title="Company Profile" description="Maintain the legal, tax, contact, banking, and invoice identity of your company."><a mat-button routerLink="/admin"><span class="material-symbols-rounded">arrow_back</span>Admin Center</a><app-status-chip label="Configured" tone="success"/></app-page-header>@if(model()){<form #form="ngForm" (ngSubmit)="save()"><app-form-section title="Organization Identity" description="Primary company and statutory registration details." icon="business"><div class="fields"><mat-form-field appearance="outline"><mat-label>Company Code</mat-label><input matInput required name="code" [(ngModel)]="model()!.companyCode"></mat-form-field><mat-form-field appearance="outline"><mat-label>Company Name</mat-label><input matInput required name="name" [(ngModel)]="model()!.companyName"></mat-form-field><mat-form-field appearance="outline"><mat-label>Legal Name</mat-label><input matInput name="legal" [(ngModel)]="model()!.legalName"></mat-form-field><mat-form-field appearance="outline"><mat-label>GSTIN</mat-label><input matInput name="gst" maxlength="15" [(ngModel)]="model()!.gstin"></mat-form-field><mat-form-field appearance="outline"><mat-label>PAN</mat-label><input matInput name="pan" maxlength="10" [(ngModel)]="model()!.pan"></mat-form-field><mat-form-field appearance="outline"><mat-label>CIN</mat-label><input matInput name="cin" [(ngModel)]="model()!.cin"></mat-form-field></div></app-form-section><app-form-section title="Contact & Address" description="Business communication and registered address." icon="contact_mail"><div class="fields"><mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" name="email" [(ngModel)]="model()!.email"></mat-form-field><mat-form-field appearance="outline"><mat-label>Phone</mat-label><input matInput name="phone" [(ngModel)]="model()!.phone"></mat-form-field><mat-form-field appearance="outline" class="span-2"><mat-label>Address</mat-label><input matInput name="address" [(ngModel)]="model()!.addressLine1"></mat-form-field><mat-form-field appearance="outline"><mat-label>City</mat-label><input matInput name="city" [(ngModel)]="model()!.city"></mat-form-field><mat-form-field appearance="outline"><mat-label>State</mat-label><input matInput name="state" [(ngModel)]="model()!.state"></mat-form-field><mat-form-field appearance="outline"><mat-label>State Code</mat-label><input matInput name="stateCode" [(ngModel)]="model()!.stateCode"></mat-form-field></div></app-form-section><app-form-section title="Banking & Documents" description="Default settlement account and invoice content." icon="account_balance"><div class="fields"><mat-form-field appearance="outline"><mat-label>Bank</mat-label><input matInput name="bank" [(ngModel)]="model()!.bankName"></mat-form-field><mat-form-field appearance="outline"><mat-label>Account Number</mat-label><input matInput name="account" [(ngModel)]="model()!.accountNumber"></mat-form-field><mat-form-field appearance="outline"><mat-label>IFSC</mat-label><input matInput name="ifsc" [(ngModel)]="model()!.ifscCode"></mat-form-field><mat-form-field appearance="outline" class="span-3"><mat-label>Terms and Conditions</mat-label><textarea matInput name="terms" rows="3" [(ngModel)]="model()!.termsAndConditions"></textarea></mat-form-field><mat-form-field appearance="outline" class="span-3"><mat-label>Invoice Footer</mat-label><textarea matInput name="footer" rows="2" [(ngModel)]="model()!.invoiceFooter"></textarea></mat-form-field></div></app-form-section><footer><span>Changes are recorded in Audit History.</span><button mat-flat-button color="primary" [disabled]="form.invalid"><span class="material-symbols-rounded">save</span>Save Company</button></footer></form>}</app-page-container>
