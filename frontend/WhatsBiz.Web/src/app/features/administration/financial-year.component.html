<h1>Financial Years</h1>
<form (ngSubmit)="save()">
  <input required name="code" placeholder="2026-27" [(ngModel)]="model.code" /><input
    required
    type="date"
    name="start"
    [(ngModel)]="model.startDate"
  /><input required type="date" name="end" [(ngModel)]="model.endDate" /><select
    name="status"
    [(ngModel)]="model.status"
  >
    <option>OPEN</option>
    <option>CLOSED</option>
    <option>LOCKED</option></select
  ><label><input type="checkbox" name="default" [(ngModel)]="model.isDefault" />Default</label
  ><button mat-flat-button>Save</button>
</form>
<table>
  <tr>
    <th>Year</th>
    <th>Dates</th>
    <th>Status</th>
    <th>Default</th>
  </tr>
  @for (x of years(); track x.id) {
    <tr>
      <td>{{ x.code }}</td>
      <td>{{ x.startDate }} — {{ x.endDate }}</td>
      <td>{{ x.status }}</td>
      <td>{{ x.isDefault ? 'Yes' : 'No' }}</td>
    </tr>
  }
</table>
