<h1>Tax Configuration</h1>
@if (model()) {
  <form #f="ngForm" (ngSubmit)="save()">
    <label>Legal name<input required name="legalName" [(ngModel)]="model()!.legalName" /></label
    ><label>Trade name<input name="tradeName" [(ngModel)]="model()!.tradeName" /></label
    ><label
      >Company GSTIN<input
        name="gstin"
        pattern="^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
        maxlength="15"
        [(ngModel)]="model()!.companyGstin" /></label
    ><label
      >State code<input
        required
        name="state"
        pattern="^[0-9]{2}$"
        [(ngModel)]="model()!.stateCode" /></label
    ><label
      >Registration type<select name="type" [(ngModel)]="model()!.registrationType">
        <option>REGULAR</option>
        <option>COMPOSITION</option>
        <option>UNREGISTERED</option>
      </select></label
    ><label
      >Effective date<input
        type="date"
        required
        name="date"
        [(ngModel)]="model()!.gstEffectiveDate" /></label
    ><label class="check"
      ><input
        type="checkbox"
        name="composition"
        [(ngModel)]="model()!.isCompositionScheme"
      />Composition scheme</label
    ><button mat-flat-button [disabled]="f.invalid">Save configuration</button>
  </form>
}
