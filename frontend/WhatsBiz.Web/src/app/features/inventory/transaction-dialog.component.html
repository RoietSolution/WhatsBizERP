<h2 mat-dialog-title>{{ data.transactionNo }}</h2>
<mat-dialog-content
  ><p>{{ data.transactionType }} · {{ data.warehouseName }}</p>
  @for (x of data.details; track x.transactionDetailId) {
    <p>
      <strong>{{ x.productCode }} — {{ x.productName }}</strong
      >: {{ x.quantity }} × {{ x.unitCost }} = {{ x.totalCost }}
    </p>
  }
  <p>{{ data.remarks }}</p></mat-dialog-content
><mat-dialog-actions><button mat-button mat-dialog-close>Close</button></mat-dialog-actions>
