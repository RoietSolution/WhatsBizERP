<h1>Product categories</h1>
<div class="layout">
  <form [formGroup]="form" (ngSubmit)="save()">
    <h2>{{ editingId ? 'Edit' : 'New' }} category</h2>
    <mat-form-field
      ><mat-label>Code</mat-label><input matInput formControlName="categoryCode" /></mat-form-field
    ><mat-form-field
      ><mat-label>Name</mat-label><input matInput formControlName="categoryName" /></mat-form-field
    ><mat-form-field
      ><mat-label>Description</mat-label
      ><textarea matInput formControlName="description"></textarea></mat-form-field
    ><mat-form-field
      ><mat-label>Parent</mat-label
      ><mat-select formControlName="parentCategoryId"
        ><mat-option [value]="null">None</mat-option>
        @for (item of flat(); track item.productCategoryId) {
          <mat-option
            [value]="item.productCategoryId"
            [disabled]="item.productCategoryId === editingId"
            >{{ item.categoryName }}</mat-option
          >
        }
      </mat-select></mat-form-field
    ><mat-form-field
      ><mat-label>Display order</mat-label
      ><input matInput type="number" formControlName="displayOrder" /></mat-form-field
    ><mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
    <div>
      <button mat-flat-button type="submit" [disabled]="form.invalid">Save</button
      ><button mat-button type="button" (click)="reset()">Clear</button>
    </div>
  </form>
  <div class="table">
    <table mat-table [dataSource]="flat()">
      <ng-container matColumnDef="code"
        ><th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let x">{{ x.categoryCode }}</td></ng-container
      ><ng-container matColumnDef="name"
        ><th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let x">{{ x.categoryName }}</td></ng-container
      ><ng-container matColumnDef="status"
        ><th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let x">
          {{ x.isActive ? 'Active' : 'Inactive' }}
        </td></ng-container
      ><ng-container matColumnDef="actions"
        ><th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let x">
          <button mat-button (click)="edit(x)">Edit</button
          ><button mat-button (click)="remove(x)">Delete</button>
        </td></ng-container
      >
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
</div>
