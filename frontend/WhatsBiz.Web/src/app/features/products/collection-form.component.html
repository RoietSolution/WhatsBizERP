<app-page-container><app-page-header [title]="id?'Edit collection':'New collection'" description="Configure collection details and merchandising period."><a mat-button routerLink="/products/collections">Cancel</a></app-page-header><form class="form-card" [formGroup]="form" (ngSubmit)="save()"><mat-form-field appearance="outline"><mat-label>Name</mat-label><input matInput formControlName="name" /><mat-error>Name is required.</mat-error></mat-form-field><mat-form-field appearance="outline"><mat-label>Display order</mat-label><input matInput type="number" formControlName="displayOrder" /></mat-form-field><mat-form-field class="wide" appearance="outline"><mat-label>Description</mat-label><textarea matInput rows="4" formControlName="description"></textarea></mat-form-field><mat-form-field appearance="outline"><mat-label>Start date</mat-label><input matInput [matDatepicker]="startPicker" formControlName="startDate" /><mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle><mat-datepicker #startPicker></mat-datepicker></mat-form-field><mat-form-field appearance="outline"><mat-label>End date</mat-label><input matInput [matDatepicker]="endPicker" formControlName="endDate" /><mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle><mat-datepicker #endPicker></mat-datepicker></mat-form-field><mat-checkbox class="wide" formControlName="isActive">Active collection</mat-checkbox><div class="actions"><a mat-button routerLink="/products/collections">Cancel</a><button mat-flat-button color="primary" type="submit">Save collection</button></div></form></app-page-container>
