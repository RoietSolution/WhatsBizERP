<div class="page-heading"><h1>Units of measure</h1><div class="page-actions">
  <button mat-stroked-button type="button" (click)="template()"><span class="material-symbols-rounded">download</span>Template</button>
  <button mat-stroked-button type="button" [disabled]="importing()" (click)="fileInput.click()"><span class="material-symbols-rounded">upload</span>{{ importing() ? 'Importing…' : 'Import' }}</button>
  <button mat-stroked-button type="button" (click)="export()"><span class="material-symbols-rounded">download</span>Export</button>
</div></div><input #fileInput hidden type="file" accept=".xlsx" (change)="upload($event)" />
<div class="layout">
  <form [formGroup]="form" (ngSubmit)="save()">
    <h2>{{ editingId ? 'Edit' : 'New' }} unit</h2>
    <mat-form-field
      ><mat-label>Code (optional)</mat-label><input matInput formControlName="unitCode" /><mat-hint>Generated automatically when blank</mat-hint></mat-form-field
    ><mat-form-field
      ><mat-label>Name</mat-label><input matInput formControlName="unitName" /></mat-form-field
    ><mat-form-field
      ><mat-label>Short name</mat-label
      ><input matInput formControlName="shortName" /></mat-form-field
    ><mat-form-field
      ><mat-label>Decimal places</mat-label
      ><input matInput type="number" formControlName="decimalPlaces" /></mat-form-field
    ><mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
    <div>
      <button mat-flat-button type="submit" [disabled]="form.invalid">Save</button
      ><button mat-button type="button" (click)="reset()">Clear</button>
    </div>
  </form>
  <section>
    @for (item of items(); track item.unitId) {
      <article>
        <div>
          <strong>{{ item.unitName }}</strong
          ><small
            >{{ item.unitCode }} · {{ item.shortName }} · {{ item.decimalPlaces }} decimals</small
          >
        </div>
        <button mat-button (click)="edit(item)">Edit</button
        ><button mat-button (click)="remove(item)">Delete</button>
      </article>
    }
  </section>
</div>
