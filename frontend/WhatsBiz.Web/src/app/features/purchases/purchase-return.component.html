<h1>Purchase Return</h1>
@if (p(); as x) {
  <p>{{ x.invoiceNumber }} · {{ x.supplierName }}</p>
  <table>
    <tr>
      <th>Product</th>
      <th>Purchased</th>
      <th>Already returned</th>
      <th>Return now</th>
    </tr>
    @for (i of x.items; track i.purchaseItemId) {
      <tr>
        <td>{{ i.productName }}</td>
        <td>{{ i.quantity + i.freeQuantity }}</td>
        <td>{{ i.returnedQuantity }}</td>
        <td>
          <input
            type="number"
            min="0"
            [max]="i.quantity + i.freeQuantity - i.returnedQuantity"
            [(ngModel)]="qty[i.purchaseItemId]"
          />
        </td>
      </tr>
    }
  </table>
  <mat-form-field
    ><mat-label>Return reason</mat-label
    ><textarea matInput [(ngModel)]="reason"></textarea></mat-form-field
  ><button mat-flat-button (click)="submit()">Post Return</button>
}
