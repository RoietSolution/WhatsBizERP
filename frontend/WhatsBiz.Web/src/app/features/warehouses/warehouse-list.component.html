<app-master-page
  [config]="config"
  [rows]="items()"
  [total]="total()"
  [loading]="loading()"
  [pageIndex]="page - 1"
  [pageSize]="size"
  [summaries]="summaries()"
  (searchChange)="search = $event; page = 1; load()"
  (statusChange)="status = $event; page = 1; load()"
  (pageChange)="paged($event)"
  (sortChange)="sorted($event)"
  (action)="handle($event)"
  ><mat-form-field master-filters appearance="outline"
    ><mat-label>Warehouse type</mat-label
    ><mat-select [formControl]="type" (selectionChange)="page = 1; load()"
      ><mat-option value="">All types</mat-option>
      @for (x of types(); track x.warehouseTypeId) {
        <mat-option [value]="x.warehouseTypeId">{{ x.typeName }}</mat-option>
      }
    </mat-select></mat-form-field
  ></app-master-page
><input #file hidden type="file" accept=".xlsx" (change)="upload($event)" />
