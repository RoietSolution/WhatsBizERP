<div class="chart" role="img" [attr.aria-label]="ariaLabel()">
  <apx-chart
    [series]="$any(config().series)"
    [chart]="{
      type: config().type,
      height: config().height ?? 300,
      toolbar: { show: false },
      animations: { enabled: true, speed: 200 },
      fontFamily: `Inter, Segoe UI, sans-serif`,
      background: `transparent`,
    }"
    [colors]="config().colors ?? palette"
    [labels]="config().labels ?? []"
    [xaxis]="{
      categories: config().categories ?? [],
      labels: { style: { colors: `#6B7280`, fontSize: `11px` } },
      axisBorder: { show: false },
      axisTicks: { show: false },
    }"
    [yaxis]="{ labels: { formatter: valueLabel, style: { colors: `#6B7280`, fontSize: `11px` } } }"
    [stroke]="{ curve: `smooth`, width: config().type === `bar` ? 0 : 3 }"
    [fill]="{
      type: config().type === `area` ? `gradient` : `solid`,
      gradient: { shadeIntensity: 1, opacityFrom: 0.3, opacityTo: 0.04, stops: [0, 95, 100] },
    }"
    [dataLabels]="{ enabled: false }"
    [grid]="{ borderColor: `#E5E7EB`, strokeDashArray: 4, padding: { left: 8, right: 8 } }"
    [legend]="{
      show: true,
      position: `bottom`,
      fontSize: `12px`,
      labels: { colors: `#6B7280` },
      markers: { size: 5 },
    }"
    [tooltip]="{ theme: `light`, y: { formatter: tooltipLabel } }"
    [plotOptions]="{
      bar: { borderRadius: 5, columnWidth: `48%`, horizontal: config().horizontal ?? false },
    }"
    [responsive]="responsive"
  />
</div>
