<div class="dialog-icon" [attr.data-tone]="data.tone ?? `warning`">
  <span class="material-symbols-rounded">{{ icon }}</span>
</div>
<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content
><mat-dialog-actions align="end"
  ><button mat-button type="button" (click)="dialog.close(false)">
    {{ data.cancelLabel ?? 'Cancel' }}</button
  ><button
    mat-flat-button
    [class.wb-danger-button]="data.tone === `danger`"
    type="button"
    (click)="dialog.close(true)"
  >
    {{ data.confirmLabel ?? 'Confirm' }}
  </button></mat-dialog-actions
>
