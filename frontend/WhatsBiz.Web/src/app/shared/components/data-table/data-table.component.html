<section class="data-table" [class.data-table--loading]="loading()">
  <header>
    <app-search-box [placeholder]="searchPlaceholder()" (searchChange)="search($event)" />
    <div>
      <ng-content select="[table-actions]" /><button
        mat-icon-button
        type="button"
        aria-label="Export visible rows as CSV"
        (click)="exportCsv()"
      >
        <span class="material-symbols-rounded">download</span></button
      ><button mat-icon-button type="button" aria-label="Choose visible columns" [matMenuTriggerFor]="columnsMenu">
        <span class="material-symbols-rounded">view_column</span>
      </button>
      <mat-menu #columnsMenu="matMenu">
        <div class="column-menu-title" (click)="$event.stopPropagation()">Visible columns</div>
        @for (column of columns(); track column.colId || column.field || column.headerName) {
          <button mat-menu-item type="button" (click)="toggleColumn(column)">
            <span class="material-symbols-rounded">{{ columnVisible(column) ? 'check_box' : 'check_box_outline_blank' }}</span>
            <span>{{ columnLabel(column) }}</span>
          </button>
        }
        <button mat-menu-item type="button" (click)="showAllColumns()">
          <span class="material-symbols-rounded">select_all</span><span>Show all columns</span>
        </button>
      </mat-menu>
    </div>
  </header>
  @if (rows().length) {
    <ag-grid-angular
      [theme]="gridTheme"
      [rowData]="rows()"
      [columnDefs]="displayColumns()"
      [defaultColDef]="defaultColumn"
      [pagination]="pagination()"
      [paginationPageSize]="pageSize()"
      [paginationPageSizeSelector]="pageSizes"
      [rowSelection]="selection"
      [animateRows]="true"
      [suppressCellFocus]="false"
      [ensureDomOrder]="true"
      domLayout="autoHeight"
      (gridReady)="gridReady($event)"
      (selectionChanged)="emitSelection()"
      (sortChanged)="emitSort($event)"
      (cellDoubleClicked)="openRow($event)"
      (cellContextMenu)="contextRow($event)"
    />
  } @else if (!loading()) {
    <app-empty-state [title]="emptyTitle()" [description]="emptyDescription()"
      ><ng-content select="[empty-action]"
    /></app-empty-state>
  }
  @if (loading()) {
    <div class="grid-loading" role="status">
      <span class="material-symbols-rounded">progress_activity</span>Loading records…
    </div>
  }
</section>
