<section [class.filter-panel--collapsed]="collapsed()">
  <header>
    <div>
      <span class="material-symbols-rounded">filter_alt</span><strong>{{ title() }}</strong>
    </div>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="collapsed() ? `Expand ${title()}` : `Collapse ${title()}`"
      (click)="toggle()"
    >
      <span class="material-symbols-rounded">{{
        collapsed() ? 'expand_more' : 'expand_less'
      }}</span>
    </button>
  </header>
  @if (!collapsed()) {
    <div class="filter-panel__body"><ng-content /></div>
    <footer>
      <div>
        <button mat-button type="button" (click)="save.emit()">
          <span class="material-symbols-rounded">bookmark_add</span>Save Filter</button
        ><button mat-button type="button" (click)="load.emit()">
          <span class="material-symbols-rounded">bookmarks</span>Load Filter
        </button>
      </div>
      <div>
        <button mat-button type="button" (click)="reset.emit()">Reset</button
        ><button mat-flat-button color="primary" type="button" (click)="apply.emit()">
          Apply filters
        </button>
      </div>
    </footer>
  }
</section>
