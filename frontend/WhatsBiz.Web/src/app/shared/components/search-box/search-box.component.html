<label
  ><span class="material-symbols-rounded">search</span><span class="sr-only">{{ ariaLabel() }}</span
  ><input
    type="search"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [ngModel]="value()"
    (ngModelChange)="value.set($event); searchChange.emit($event)"
  />
  @if (value()) {
    <button type="button" aria-label="Clear search" (click)="clear()">
      <span class="material-symbols-rounded">close</span>
    </button>
  }
</label>
