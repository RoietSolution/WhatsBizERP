<article class="summary-card" tabindex="0">
  <div class="summary-card__icon" [attr.data-tone]="tone()">
    <span class="material-symbols-rounded">{{ icon() }}</span>
  </div>
  <div class="summary-card__copy">
    <p>{{ label() }}</p>
    <strong>{{ value() }}</strong>
    @if (trend()) {
      <small [attr.data-positive]="trendPositive()"
        ><span class="material-symbols-rounded">{{
          trendPositive() ? 'trending_up' : 'trending_down'
        }}</span
        >{{ trend() }}</small
      >
    }
  </div>
  @if (sparkline().length) {
    <div class="summary-card__sparkline" aria-hidden="true">
      @for (point of sparkline(); track $index) {
        <i [style.height.%]="point"></i>
      }
    </div>
  }
</article>
