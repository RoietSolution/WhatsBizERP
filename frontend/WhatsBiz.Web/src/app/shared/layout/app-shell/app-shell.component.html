<mat-sidenav-container
  [autosize]="!mobile()"
  [class.sidebar-collapsed]="!mobile() && layout.sidebarCollapsed()"
  [class.pos-sale-layout]="posSale()"
  ><mat-sidenav
    [mode]="mobile() ? `over` : `side`"
    [opened]="mobile() ? layout.mobileOpen() : true"
    [disableClose]="!mobile()"
    (closedStart)="layout.closeMobile()"
    ><app-sidebar
      [collapsed]="!mobile() && layout.sidebarCollapsed()"
      (collapseToggle)="layout.toggleSidebar()"
      (navigate)="mobile() && layout.closeMobile()" /></mat-sidenav
  ><mat-sidenav-content
    ><app-topbar (menuToggle)="layout.toggleMobile()" />
    <div class="content-frame">
      <app-breadcrumb />
      <main id="main-content" tabindex="-1"><ng-content /></main>
      <footer>
        <span>© {{ year }} KhataDhari ERP</span><span>Secure enterprise workspace</span>
      </footer>
    </div>
    @if (compactMobile()) {
      <nav class="mobile-quick-nav" aria-label="Quick navigation">
        @for (item of mobileDestinations(); track item.route) {
          <a [routerLink]="item.route" routerLinkActive="active" ariaCurrentWhenActive="page">
            <span class="material-symbols-rounded" aria-hidden="true">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        }
        <button type="button" [class.active]="moreActive()" [attr.aria-current]="moreActive() ? 'page' : null" (click)="layout.toggleMobile()" aria-label="More navigation options">
          <span class="material-symbols-rounded" aria-hidden="true">more_horiz</span>
          <span>More</span>
        </button>
      </nav>
    }</mat-sidenav-content
  ></mat-sidenav-container
>
